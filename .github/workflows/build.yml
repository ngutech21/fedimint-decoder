name: Build

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  nix-build:
    name: Nix flake build
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Build app
        run: nix build .#
