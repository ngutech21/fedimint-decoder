<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fedimint Decoder</title>
    <style>
      :root {
        color-scheme: light;
        --page: oklch(96.5% 0.012 172);
        --panel: oklch(99% 0.006 172);
        --surface: oklch(98% 0.007 172);
        --surface-strong: oklch(93.5% 0.014 172);
        --text: oklch(21% 0.018 175);
        --muted: oklch(47% 0.025 175);
        --muted-soft: oklch(56% 0.022 175);
        --line: oklch(85% 0.018 175);
        --line-strong: oklch(74% 0.035 175);
        --accent: oklch(55% 0.14 165);
        --accent-strong: oklch(46% 0.13 165);
        --accent-text: oklch(98% 0.008 165);
        --error-surface: oklch(97% 0.012 28);
        --shadow-soft: 0 18px 50px oklch(33% 0.03 175 / 8%);
        --space-2xs: 6px;
        --space-xs: 10px;
        --space-sm: 14px;
        --space-md: 18px;
        --space-lg: 28px;
        --space-xl: 44px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background:
          linear-gradient(180deg, oklch(98% 0.011 172) 0, var(--page) 340px);
        color: var(--text);
        font-family:
          "IBM Plex Sans", Aptos, "SF Pro Text", ui-sans-serif, system-ui,
          -apple-system, BlinkMacSystemFont, sans-serif;
      }

      button,
      textarea {
        font: inherit;
      }

      a {
        color: inherit;
      }

      button:focus-visible,
      summary:focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px oklch(55% 0.14 165 / 16%);
      }

      .app-shell {
        width: min(100% - 40px, 1180px);
        margin: 0 auto;
        padding: 40px 0 72px;
      }

      .decoder-panel {
        display: grid;
        gap: var(--space-xl);
      }

      .intro {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: var(--space-md);
        align-items: start;
        padding-bottom: var(--space-lg);
        border-bottom: 1px solid var(--line);
      }

      .intro-meta {
        display: flex;
        grid-column: 1 / -1;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-sm);
      }

      .intro-copy {
        display: grid;
        gap: var(--space-sm);
        max-width: 820px;
      }

      .eyebrow {
        margin: 0;
        color: var(--accent-strong);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .privacy-badge {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0 12px;
        background: var(--surface);
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 750;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        max-width: 18ch;
        font-size: 3.2rem;
        line-height: 0.98;
        letter-spacing: 0;
      }

      .lede {
        max-width: 62ch;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      .input-panel {
        display: grid;
        gap: var(--space-sm);
      }

      .section-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: var(--space-sm);
      }

      .section-heading span {
        color: var(--muted);
        font-size: 0.84rem;
        font-weight: 650;
      }

      .input-label {
        display: block;
        font-weight: 700;
      }

      .decoder-input {
        width: 100%;
        min-height: 220px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
        background: var(--panel);
        color: var(--text);
        line-height: 1.5;
        outline: none;
        box-shadow:
          inset 0 1px 0 oklch(100% 0 0 / 70%),
          var(--shadow-soft);
      }

      .decoder-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px oklch(55% 0.14 165 / 16%);
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: var(--space-xs);
      }

      .clear-button,
      .decode-button {
        min-height: 44px;
        border-radius: 8px;
        padding: 0 22px;
        font-weight: 800;
        cursor: pointer;
        transition:
          background-color 180ms ease,
          border-color 180ms ease,
          transform 180ms ease;
      }

      .clear-button {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text);
      }

      .clear-button:hover,
      .clear-button:focus-visible {
        border-color: var(--line-strong);
        background: var(--surface);
      }

      .decode-button {
        border: 0;
        background: var(--accent);
        color: var(--accent-text);
        min-width: 126px;
      }

      .decode-button:hover {
        background: var(--accent-strong);
      }

      .clear-button:active,
      .decode-button:active {
        transform: translateY(1px);
      }

      .decode-button:focus-visible {
        background: var(--accent-strong);
      }

      .result-panel {
        display: grid;
        gap: var(--space-lg);
        border-top: 1px solid var(--line);
        padding-top: var(--space-lg);
      }

      .result-panel h2,
      .detail-block h3 {
        font-size: 1.05rem;
        line-height: 1.25;
      }

      .result-heading {
        align-items: baseline;
      }

      .result-panel p {
        color: var(--muted);
        line-height: 1.5;
      }

      .error-message {
        color: oklch(45% 0.16 28);
        font-weight: 650;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--line);
      }

      .invite-summary {
        grid-template-columns: 1fr;
      }

      .summary-item {
        display: grid;
        grid-template-columns: minmax(132px, 0.28fr) minmax(0, 1fr);
        gap: var(--space-sm);
        align-items: baseline;
        min-width: 0;
        padding: 15px 16px;
        background: var(--panel);
      }

      .summary-item strong {
        min-width: 0;
      }

      .summary-label {
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
      }

      .summary-item strong {
        font-size: 1.08rem;
      }

      .summary-grid:not(.invite-summary) .summary-item:last-child:nth-child(odd) {
        grid-column: 1 / -1;
      }

      .summary-item strong,
      .federation-value,
      .error-detail code,
      .raw-code {
        overflow-wrap: anywhere;
      }

      .mono,
      code {
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", ui-monospace,
          monospace;
      }

      .detail-block {
        display: grid;
        gap: var(--space-sm);
      }

      .detail-block > .detail-block {
        margin-top: var(--space-md);
      }

      .federation-summary {
        grid-column: 1 / -1;
        align-items: start;
      }

      .federation-value {
        display: grid;
        gap: var(--space-xs);
        min-width: 0;
      }

      .subtle-note {
        color: var(--muted);
        font-size: 0.86rem;
        font-weight: 650;
      }

      .observer-link {
        width: fit-content;
        color: var(--accent-strong);
        font-size: 0.86rem;
        font-weight: 750;
        text-decoration-color: oklch(46% 0.13 165 / 45%);
        text-underline-offset: 3px;
      }

      .observer-link:hover {
        color: var(--accent);
        text-decoration-color: currentColor;
      }

      .inline-details {
        display: grid;
        gap: var(--space-sm);
        min-width: 0;
      }

      .inline-details summary {
        width: fit-content;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 10px;
        background: var(--surface);
        color: var(--text);
        font-size: 0.86rem;
        font-weight: 750;
        cursor: pointer;
      }

      .inline-details summary:hover {
        border-color: var(--line-strong);
      }

      .inline-details[open] summary {
        border-color: var(--line-strong);
        background: var(--surface-strong);
      }

      .inline-detail-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--line);
      }

      .inline-detail-grid > div {
        display: grid;
        gap: var(--space-2xs);
        min-width: 0;
        padding: 12px;
        background: var(--surface);
      }

      .inline-detail-wide {
        grid-column: 1 / -1;
      }

      .inline-details .raw-disclosure {
        border-top: 0;
        padding-top: 0;
      }

      .denomination-list {
        display: grid;
        border-block: 1px solid var(--line);
        overflow: hidden;
      }

      .denomination-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(80px, 0.35fr) minmax(0, 1fr);
        gap: var(--space-sm);
        align-items: center;
        padding: 12px 0;
        background: transparent;
      }

      .denomination-row + .denomination-row {
        border-top: 1px solid var(--line);
      }

      .denomination-header {
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      .note-inventory {
        display: grid;
        gap: var(--space-xs);
        border-top: 1px solid var(--line);
        padding-top: var(--space-md);
      }

      .note-inventory summary {
        width: fit-content;
        border-radius: 6px;
        color: var(--text);
        font-weight: 800;
        cursor: pointer;
      }

      .note-inventory p {
        margin-top: 8px;
      }

      .note-list {
        display: grid;
        margin-top: var(--space-sm);
        border-block: 1px solid var(--line);
      }

      .note-row {
        display: grid;
        grid-template-columns: 44px minmax(96px, 0.8fr) minmax(72px, 0.5fr) minmax(0, 2fr);
        gap: var(--space-sm);
        align-items: baseline;
        min-width: 0;
        padding: 11px 0;
      }

      .note-row + .note-row {
        border-top: 1px solid var(--line);
      }

      .note-header {
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      .note-row code {
        overflow-wrap: anywhere;
      }

      .raw-code {
        display: block;
        border-block: 1px solid var(--line);
        padding: 14px 0;
        background: transparent;
        line-height: 1.5;
      }

      .raw-disclosure {
        display: grid;
        gap: var(--space-xs);
        border-top: 1px solid var(--line);
        padding-top: var(--space-md);
      }

      .raw-disclosure summary {
        width: fit-content;
        border-radius: 6px;
        color: var(--text);
        font-weight: 800;
        cursor: pointer;
      }

      .raw-disclosure p {
        margin-top: 8px;
      }

      .raw-disclosure .raw-code {
        margin-top: 8px;
      }

      .error-panel {
        display: grid;
        gap: var(--space-sm);
        border: 1px solid oklch(86% 0.035 28);
        border-radius: 8px;
        padding: 16px;
        background: var(--error-surface);
      }

      .error-grid {
        display: grid;
        gap: 1px;
        overflow: hidden;
        border: 1px solid oklch(86% 0.035 28);
        border-radius: 8px;
        background: oklch(86% 0.035 28);
      }

      .error-detail {
        display: grid;
        grid-template-columns: minmax(130px, 0.32fr) minmax(0, 1fr);
        gap: 12px;
        align-items: baseline;
        min-width: 0;
        padding: 12px 14px;
        background: var(--panel);
      }

      .error-detail code {
        color: var(--text);
        line-height: 1.5;
      }

      @media (max-width: 860px) {
        .app-shell {
          width: min(100% - 28px, 1180px);
          padding-top: 28px;
        }

        h1 {
          max-width: 20ch;
          font-size: 2.45rem;
        }

        .summary-grid {
          grid-template-columns: 1fr;
        }

      }

      @media (max-width: 640px) {
        .app-shell {
          width: min(100% - 20px, 1180px);
          padding: 20px 0 44px;
        }

        .decoder-panel {
          gap: 34px;
        }

        .intro {
          gap: var(--space-sm);
        }

        .intro-meta,
        .section-heading {
          align-items: flex-start;
          flex-direction: column;
        }

        .privacy-badge {
          min-height: 28px;
        }

        .actions {
          justify-content: stretch;
          flex-direction: column-reverse;
        }

        .decode-button {
          width: 100%;
        }

        .clear-button {
          width: 100%;
        }

        .summary-grid,
        .summary-item,
        .inline-detail-grid,
        .error-detail {
          grid-template-columns: 1fr;
        }

        .denomination-row {
          grid-template-columns: minmax(0, 1fr) minmax(52px, 0.35fr) minmax(0, 1fr);
          gap: 8px;
        }

        .note-row {
          grid-template-columns: 28px minmax(88px, 0.7fr) minmax(48px, 0.4fr) minmax(0, 1.6fr);
          gap: 6px;
          font-size: 0.94rem;
        }

        .denomination-header {
          font-size: 0.72rem;
        }

        .note-header {
          font-size: 0.72rem;
        }

        h1 {
          font-size: 2rem;
        }

        .decoder-input {
          min-height: 190px;
          padding: 14px;
        }
      }
    </style>
  </head>
  <body></body>
</html>
