<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fedimint Decoder</title>
    <style>
      :root {
        color-scheme: light;
        --page: oklch(97% 0.01 170);
        --panel: oklch(99% 0.006 170);
        --text: oklch(21% 0.018 175);
        --muted: oklch(47% 0.025 175);
        --line: oklch(86% 0.018 175);
        --accent: oklch(55% 0.14 165);
        --accent-strong: oklch(46% 0.13 165);
        --accent-text: oklch(98% 0.008 165);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: var(--page);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      button,
      textarea {
        font: inherit;
      }

      .app-shell {
        width: min(100% - 32px, 920px);
        margin: 0 auto;
        padding: 48px 0;
      }

      .decoder-panel {
        display: grid;
        gap: 18px;
        padding: clamp(24px, 5vw, 44px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 24px 70px oklch(30% 0.04 170 / 12%);
      }

      .intro {
        display: grid;
        gap: 10px;
      }

      .eyebrow {
        margin: 0;
        color: var(--accent-strong);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        max-width: 14ch;
        font-size: clamp(2.2rem, 6vw, 4.4rem);
        line-height: 0.95;
        letter-spacing: 0;
      }

      .lede {
        max-width: 62ch;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      .input-label {
        margin-top: 8px;
        font-weight: 700;
      }

      .decoder-input {
        width: 100%;
        min-height: 240px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
        background: oklch(98% 0.004 170);
        color: var(--text);
        line-height: 1.5;
        outline: none;
      }

      .decoder-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px oklch(55% 0.14 165 / 16%);
      }

      .actions {
        display: flex;
        justify-content: flex-end;
      }

      .decode-button {
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        padding: 0 20px;
        background: var(--accent);
        color: var(--accent-text);
        font-weight: 800;
        cursor: pointer;
      }

      .decode-button:hover {
        background: var(--accent-strong);
      }

      .result-panel {
        display: grid;
        gap: 8px;
        border-top: 1px solid var(--line);
        padding-top: 18px;
      }

      .result-panel h2 {
        font-size: 1rem;
      }

      .result-panel p {
        color: var(--muted);
        line-height: 1.5;
      }

      @media (max-width: 640px) {
        .app-shell {
          width: min(100% - 20px, 920px);
          padding: 20px 0;
        }

        .decoder-panel {
          padding: 20px;
        }

        .actions {
          justify-content: stretch;
        }

        .decode-button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body></body>
</html>
