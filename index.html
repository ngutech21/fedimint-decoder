<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fedimint Decoder</title>
    <style>
      :root {
        color-scheme: light;
        --page: oklch(96% 0.011 172);
        --panel: oklch(99% 0.006 172);
        --surface: oklch(98% 0.006 172);
        --surface-strong: oklch(94% 0.013 172);
        --text: oklch(21% 0.018 175);
        --muted: oklch(47% 0.025 175);
        --line: oklch(84% 0.019 175);
        --line-strong: oklch(74% 0.035 175);
        --accent: oklch(55% 0.14 165);
        --accent-strong: oklch(46% 0.13 165);
        --accent-text: oklch(98% 0.008 165);
        --error-surface: oklch(97% 0.012 28);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: var(--page);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      button,
      textarea {
        font: inherit;
      }

      button:focus-visible,
      summary:focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px oklch(55% 0.14 165 / 16%);
      }

      .app-shell {
        width: min(100% - 32px, 1040px);
        margin: 0 auto;
        padding: 36px 0 56px;
      }

      .decoder-panel {
        display: grid;
        gap: 20px;
      }

      .intro {
        display: grid;
        gap: 8px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--line);
      }

      .eyebrow {
        margin: 0;
        color: var(--accent-strong);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        max-width: 18ch;
        font-size: 2.75rem;
        line-height: 1;
        letter-spacing: 0;
      }

      .lede {
        max-width: 62ch;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      .input-label {
        margin-top: 4px;
        font-weight: 700;
      }

      .decoder-input {
        width: 100%;
        min-height: 210px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
        background: var(--panel);
        color: var(--text);
        line-height: 1.5;
        outline: none;
        box-shadow: inset 0 1px 0 oklch(100% 0 0 / 65%);
      }

      .decoder-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px oklch(55% 0.14 165 / 16%);
      }

      .actions {
        display: flex;
        justify-content: flex-end;
      }

      .decode-button {
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        padding: 0 20px;
        background: var(--accent);
        color: var(--accent-text);
        font-weight: 800;
        cursor: pointer;
      }

      .decode-button:hover {
        background: var(--accent-strong);
      }

      .decode-button:focus-visible {
        background: var(--accent-strong);
      }

      .result-panel {
        display: grid;
        gap: 22px;
        border-top: 1px solid var(--line);
        padding-top: 22px;
      }

      .result-panel h2,
      .detail-block h3 {
        font-size: 1rem;
      }

      .result-panel p {
        color: var(--muted);
        line-height: 1.5;
      }

      .error-message {
        color: oklch(45% 0.16 28);
        font-weight: 650;
      }

      .status-list {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--line);
      }

      .status-item {
        display: grid;
        gap: 5px;
        min-width: 0;
        padding: 12px 14px;
        background: var(--surface-strong);
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--line);
      }

      .summary-item {
        display: grid;
        grid-template-columns: minmax(120px, 0.42fr) minmax(0, 1fr);
        gap: 12px;
        align-items: baseline;
        min-width: 0;
        padding: 12px 14px;
        background: var(--panel);
      }

      .summary-label {
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
      }

      .summary-item strong,
      .peer-row code,
      .error-detail code,
      .raw-code {
        overflow-wrap: anywhere;
      }

      .mono,
      code {
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", ui-monospace,
          monospace;
      }

      .detail-block {
        display: grid;
        gap: 9px;
      }

      .peer-list {
        display: grid;
        border-block: 1px solid var(--line);
        overflow: hidden;
      }

      .denomination-list {
        display: grid;
        border-block: 1px solid var(--line);
        overflow: hidden;
      }

      .denomination-row {
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(72px, 0.4fr) minmax(0, 1.3fr);
        gap: 12px;
        align-items: center;
        padding: 11px 0;
        background: transparent;
      }

      .denomination-row + .denomination-row {
        border-top: 1px solid var(--line);
      }

      .denomination-header {
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      .peer-row {
        display: grid;
        grid-template-columns: minmax(80px, 120px) minmax(0, 1fr);
        gap: 12px;
        padding: 11px 0;
        background: transparent;
      }

      .peer-row + .peer-row {
        border-top: 1px solid var(--line);
      }

      .peer-row span {
        color: var(--muted);
        font-weight: 700;
      }

      .raw-code {
        display: block;
        border-block: 1px solid var(--line);
        padding: 12px 0;
        background: transparent;
        line-height: 1.5;
      }

      .raw-disclosure {
        display: grid;
        gap: 8px;
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }

      .raw-disclosure summary {
        width: fit-content;
        border-radius: 6px;
        color: var(--text);
        font-weight: 800;
        cursor: pointer;
      }

      .raw-disclosure p {
        margin-top: 8px;
      }

      .raw-disclosure .raw-code {
        margin-top: 8px;
      }

      .error-panel {
        display: grid;
        gap: 12px;
      }

      .error-grid {
        display: grid;
        gap: 1px;
        overflow: hidden;
        border: 1px solid oklch(86% 0.035 28);
        border-radius: 8px;
        background: oklch(86% 0.035 28);
      }

      .error-detail {
        display: grid;
        grid-template-columns: minmax(130px, 0.32fr) minmax(0, 1fr);
        gap: 12px;
        align-items: baseline;
        min-width: 0;
        padding: 12px 14px;
        background: var(--error-surface);
      }

      .error-detail code {
        color: var(--text);
        line-height: 1.5;
      }

      @media (max-width: 640px) {
        .app-shell {
          width: min(100% - 20px, 920px);
          padding: 20px 0;
        }

        .decoder-panel {
          padding: 20px;
        }

        .actions {
          justify-content: stretch;
        }

        .decode-button {
          width: 100%;
        }

        .summary-grid,
        .status-list,
        .denomination-row,
        .peer-row,
        .summary-item,
        .error-detail {
          grid-template-columns: 1fr;
        }

        h1 {
          font-size: 2.15rem;
        }
      }
    </style>
  </head>
  <body></body>
</html>
